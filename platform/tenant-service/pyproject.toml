[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenant_service"]

[project]
name = "tenant-service"
version = "1.0.0"
description = "Enterprise Multi-Tenancy Organization Isolation Service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "prometheus-fastapi-instrumentator==7.0.0",
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "pydantic-settings==2.7.1",
  "sqlalchemy[asyncio]==2.0.51",
  "asyncpg==0.30.0",
  "alembic==1.14.0",
  "structlog==24.4.0",
  "httpx==0.27.2",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2",
]

[dependency-groups]
dev = [
  "httpx==0.27.2",
  "mypy==1.18.2",
  "pytest==8.4.2",
  "pytest-asyncio==0.24.0",
  "ruff==0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
  "ignore:'asyncio.get_event_loop_policy' is deprecated:DeprecationWarning",
  "ignore:'asyncio.set_event_loop_policy' is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
