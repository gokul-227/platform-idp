[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plugin_framework"]

[project]
name = "plugin-framework"
version = "1.0.0"
description = "Shared plugin manifest/discovery/registry framework, per docs/adr/ADR-0004"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "jsonschema==4.25.1",
  "PyYAML==6.0.2",
]

[dependency-groups]
dev = [
  "mypy==1.18.2",
  "pytest==8.4.2",
  "ruff==0.14.0",
  "types-jsonschema==4.25.1.20251009",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.13"
strict = true
