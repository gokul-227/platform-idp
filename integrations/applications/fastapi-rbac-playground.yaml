# applications/examples/fastapi-rbac-playground — a custom, local-only relying party
# built to validate this platform's authorization layer end to end (real
# Hydra introspection + real Keto ReBAC checks). Not a third-party product;
# never pushed anywhere. Converted from a paste-a-token tool to a full OIDC
# relying party so the demo can show a complete login -> claims -> RBAC-test
# flow without manual token copying.
client_id: fastapi-rbac-playground
client_name: FastAPI RBAC Playground (validation harness)
redirect_uris:
  - http://localhost:9932/callback
post_logout_redirect_uris:
  - http://localhost:9932/
grant_types:
  - authorization_code
  - refresh_token
scope: openid profile email offline_access
client_secret_env_var: FASTAPI_RBAC_PLAYGROUND_OIDC_CLIENT_SECRET
token_endpoint_auth_method: client_secret_post
enabled: true
tenant_id: default
tags:
  - validation-harness
  - sample-app
