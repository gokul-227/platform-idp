# https://taskfile.dev — Taskfile.yml
# Alternative to Make, cross-platform with better syntax
version: "3"

vars:
  PLATFORM_VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  PLATFORM_COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  COMPOSE_FILE: deployment/docker/compose/docker-compose.yml
  COMPOSE_DEV_FILE: deployment/docker/compose/docker-compose.dev.yml
  COMPOSE_OBS_FILE: deployment/docker/compose/docker-compose.observability.yml

tasks:
  # ─── Default ──────────────────────────────────────────────────────────────
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ─── Platform Lifecycle ───────────────────────────────────────────────────
  up:
    desc: Start the full platform stack
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d
      - task: health

  up:full:
    desc: Start platform with observability
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} -f {{.COMPOSE_DEV_FILE}} -f {{.COMPOSE_OBS_FILE}} up -d

  down:
    desc: Stop all services
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} -f {{.COMPOSE_DEV_FILE}} -f {{.COMPOSE_OBS_FILE}} down

  restart:
    desc: Restart all services
    cmds:
      - task: down
      - task: up

  destroy:
    desc: Stop and remove all data (DESTRUCTIVE)
    prompt: "This will destroy ALL platform data. Are you sure?"
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} -f {{.COMPOSE_DEV_FILE}} -f {{.COMPOSE_OBS_FILE}} down -v --remove-orphans

  status:
    desc: Show service status
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} -f {{.COMPOSE_DEV_FILE}} ps

  logs:
    desc: Stream logs from all services
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} logs -f --tail=100

  shell:
    desc: Open a shell in a service (SERVICE=kratos)
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec {{.SERVICE}} sh

  # ─── Health ───────────────────────────────────────────────────────────────
  health:
    desc: Check health of all services
    cmds:
      - automation/health/health-check.sh

  doctor:
    desc: Diagnose platform issues
    cmds:
      - automation/health/doctor.sh

  # ─── Setup ────────────────────────────────────────────────────────────────
  setup:
    desc: Initial platform setup
    cmds:
      - task: setup:env
      - task: setup:deps
      - task: setup:hooks
      - echo "✓ Setup complete. Run 'task up' to start."

  setup:env:
    desc: Copy .env.example to .env
    cmds:
      - test -f .env || cp .env.example .env

  setup:deps:
    desc: Install all dependencies
    cmds:
      - task: install:node
      - task: install:python-services

  setup:hooks:
    desc: Install pre-commit hooks
    cmds:
      - pre-commit install
      - pre-commit install --hook-type commit-msg

  # Node.js is a transitional state for services not yet ported to Python per
  # ADR-0012 — platform/admin-ui is intentionally absent per ADR-0011.
  install:node:
    desc: Install Node.js dependencies for services not yet ported to Python
    cmds:
      - for: []
        cmd: "[ -f {{.ITEM}}/package.json ] && (cd {{.ITEM}} && npm ci) || true"

  install:python-services:
    desc: Install Python dependencies for ported platform services
    cmds:
      - for: [platform/hooks, platform/app-registry, platform/auth-service, platform/tenant-service, platform/email-service, platform/notification-service]
        cmd: "cd {{.ITEM}} && uv sync --all-groups"

  # ─── Build ────────────────────────────────────────────────────────────────
  build:
    desc: Build all components (Python services have no separate build step)
    cmds:
      - task: build:services

  build:services:
    desc: Build remaining Node platform services
    cmds:
      - for: []
        cmd: "[ -f {{.ITEM}}/package.json ] && (cd {{.ITEM}} && npm run build) || true"

  build:images:
    desc: Build all Docker images
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} build --parallel

  # ─── Tests ────────────────────────────────────────────────────────────────
  test:
    desc: Run all tests
    cmds:
      - task: test:unit
      - task: test:integration

  test:unit:
    desc: Run unit tests
    cmds:
      - task: test:python-services

  test:python-services:
    desc: Run pytest for every ported Python platform service
    cmds:
      - for: [platform/hooks, platform/app-registry, platform/auth-service, platform/tenant-service, platform/email-service, platform/notification-service]
        cmd: "cd {{.ITEM}} && uv run pytest"

  test:integration:
    desc: Run integration tests
    dir: tests/integration
    cmds:
      - npm test

  test:e2e:
    desc: Run end-to-end tests
    dir: tests/e2e
    cmds:
      - npx playwright test

  test:load:
    desc: Run load tests
    cmds:
      - k6 run tests/load/auth-flow.js

  test:security:
    desc: Run security tests
    dir: tests/security
    cmds:
      - npm test

  # ─── Code Quality ─────────────────────────────────────────────────────────
  lint:
    desc: Run all linters
    cmds:
      - task: lint:python
      - task: lint:ts
      - task: lint:yaml
      - task: lint:helm

  lint:python:
    desc: Lint and type-check every ported Python platform service
    cmds:
      - for: [platform/hooks, platform/app-registry, platform/auth-service, platform/tenant-service, platform/email-service, platform/notification-service]
        cmd: "cd {{.ITEM}} && uv run ruff check . && uv run ruff format --check . && uv run mypy"

  lint:ts:
    desc: Lint TypeScript code
    cmds:
      - for: []
        cmd: "[ -f {{.ITEM}}/package.json ] && (cd {{.ITEM}} && npm run lint) || true"

  lint:yaml:
    desc: Lint YAML files
    cmds:
      - yamllint -c .yamllint.yml .

  lint:helm:
    desc: Lint Helm charts
    cmds:
      - helm lint deployment/helm/charts/*

  format:
    desc: Format all code
    cmds:
      - task: format:python
      - task: format:ts
      - task: format:terraform

  format:python:
    desc: Format every ported Python platform service
    cmds:
      - for: [platform/hooks, platform/app-registry, platform/auth-service, platform/tenant-service, platform/email-service, platform/notification-service]
        cmd: "cd {{.ITEM}} && uv run ruff format ."

  format:ts:
    desc: Format TypeScript code
    cmds:
      - for: []
        cmd: "[ -f {{.ITEM}}/package.json ] && (cd {{.ITEM}} && npm run format) || true"

  format:terraform:
    desc: Format Terraform code
    dir: terraform
    cmds:
      - terraform fmt -recursive

  security-scan:
    desc: Run security vulnerability scan
    cmds:
      - trivy fs . --exit-code 1 --severity HIGH,CRITICAL

  # ─── Registry ─────────────────────────────────────────────────────────────
  sync:
    desc: Sync application registry
    dir: platform/app-registry
    cmds:
      - uv run app-registry-cli sync

  sync:dry-run:
    desc: Dry-run application registry sync
    dir: platform/app-registry
    cmds:
      - uv run app-registry-cli sync --dry-run

  # ─── Database ─────────────────────────────────────────────────────────────
  migrate:
    desc: Run all database migrations
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} run --rm kratos-migrate
      - docker compose -f {{.COMPOSE_FILE}} run --rm hydra-migrate
      - docker compose -f {{.COMPOSE_FILE}} run --rm keto-migrate

  # ─── Backup ───────────────────────────────────────────────────────────────
  backup:
    desc: Backup all platform data
    cmds:
      - automation/backup/backup.sh

  restore:
    desc: Restore from backup
    prompt: "This will restore from backup. Continue?"
    cmds:
      - automation/backup/restore.sh {{.BACKUP_FILE}}

  # ─── Utilities ────────────────────────────────────────────────────────────
  version:
    desc: Show platform version
    cmds:
      - echo "Enterprise Identity Platform v{{.PLATFORM_VERSION}} ({{.PLATFORM_COMMIT}})"

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf bin/
      - find . -name "dist" -type d -not -path "*/node_modules/*" | xargs rm -rf
      - find . -name ".next" -type d | xargs rm -rf
      - find . -name "coverage" -type d | xargs rm -rf

  gen:jwks:
    desc: Generate JWK keys for Hydra
    cmds:
      - automation/setup/generate-jwks.sh

  gen:certs:
    desc: Generate self-signed TLS certificates
    cmds:
      - automation/setup/generate-certs.sh

  check:tools:
    desc: Verify required tools are installed
    cmds:
      - automation/health/check-tools.sh
