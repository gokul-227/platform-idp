# applications/examples/mealie — real upstream application (mealie-recipes/mealie
# v2.8.0), run from its unmodified official image, not vendored here.
# enabled: false by default — flip to true and run `make sync` to create the
# Hydra client. Secret comes from the env var below, never from this file.
client_id: mealie
client_name: Mealie (real upstream Python/FastAPI application)
redirect_uris:
  - http://localhost:9925/login
post_logout_redirect_uris:
  - http://localhost:9925/
grant_types:
  - authorization_code
  - refresh_token
scope: openid profile email
# Mealie's Authlib client defaults to client_secret_basic, NOT this repo's
# usual client_secret_post convention — confirmed live (client_secret_post
# fails with "invalid_client"). Always verify a new RP's actual behavior.
client_secret_env_var: MEALIE_OIDC_CLIENT_SECRET
token_endpoint_auth_method: client_secret_basic
enabled: true
tenant_id: default
tags:
  - sample-app
  - verified-upstream
