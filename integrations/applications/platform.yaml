# NeoBIM "Platform" (aec-craft) — registered as a future OIDC client of this
# platform's Hydra. NOT integrated yet: platform's own apps/auth (Better Auth +
# oauth-provider) remains the live authorization server for platform today.
# This entry only prepares Ory_IDP so a pilot relying-party surface inside
# platform can be pointed at this Hydra instance later, per the phased
# Better-Auth migration plan (docs/10-reference/neobim-plugin-architecture-proposal.md §1).
#
# `enabled: false` until platform's team explicitly opts a surface in — flipping
# this to true and running `make sync` is the entire integration step; no code
# changes on this side.
#
# redirect_uris below is a placeholder matching platform's documented local dev
# port (apps/auth, :3000) — confirm/replace with the real callback path once a
# specific platform surface is chosen to pilot against this IdP.
client_id: platform
client_name: NeoBIM Platform (aec-craft)
redirect_uris:
  - http://localhost:3000/auth/callback
post_logout_redirect_uris:
  - http://localhost:3000/
grant_types:
  - authorization_code
  - refresh_token
scope: openid profile email offline_access
client_secret_env_var: PLATFORM_OIDC_CLIENT_SECRET
token_endpoint_auth_method: client_secret_post
enabled: false
tenant_id: default
tags: [application-plugin, neobim, pending-integration, handoff-required]
