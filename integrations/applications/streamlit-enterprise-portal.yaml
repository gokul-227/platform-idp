# applications/examples/streamlit-enterprise-portal — a custom, local-only relying
# party used to validate real Keto-gated department visibility with a
# business-app-shaped UI. Not a third-party product; never pushed anywhere.
client_id: streamlit-enterprise-portal
client_name: Streamlit Enterprise Portal (validation harness)
redirect_uris:
  - http://localhost:9933/
post_logout_redirect_uris:
  - http://localhost:9933/
grant_types:
  - authorization_code
  - refresh_token
scope: openid profile email
client_secret_env_var: STREAMLIT_ENTERPRISE_PORTAL_OIDC_CLIENT_SECRET
token_endpoint_auth_method: client_secret_post
enabled: true
tenant_id: default
tags:
  - validation-harness
  - sample-app
