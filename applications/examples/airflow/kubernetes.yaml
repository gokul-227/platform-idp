apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
  labels:
    app.kubernetes.io/name: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow
  template:
    metadata:
      labels:
        app: airflow
    spec:
      containers:
        - name: airflow
          image: eip-airflow:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: AIRFLOW_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: application-oidc-secrets
                  key: airflow-client-secret
            - name: OIDC_DISCOVERY_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-urls
                  key: OIDC_DISCOVERY_URL
            - name: PLATFORM_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-urls
                  key: PLATFORM_BASE_URL
            - name: AIRFLOW__WEBSERVER__BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-urls
                  key: AIRFLOW_WEB_BASE_URL
          command: ["airflow", "standalone"]
---
apiVersion: v1
kind: Service
metadata:
  name: airflow
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: airflow
