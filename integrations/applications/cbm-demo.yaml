# NeoBIM "CBM Demo" (cognitive building model lab) — real OIDC client of this
# platform's Hydra. `cbm-demo/apps/app` (a local sibling repo, never pushed
# upstream) uses the SAME generic @aec-craft/platform-auth-nextjs adapter as
# BuildOS — its shipped code normally resolves its OAuth config via
# `resolveAuth("platform")`, which points it at NeoBIM Platform's own shared
# "platform" OAuth client (client_id sp_fpc_platform_...) on port 3002 —
# reusing that app's own identity, not a distinct registration.
#
# For a clean, distinct enterprise registration (and to avoid touching the
# shared `platform` monorepo's client registry, which other real apps also
# depend on), `apps/app/src/lib/auth.ts` was edited LOCALLY ONLY (never
# committed/pushed — cbm-demo is a disposable local clone) to bypass
# `resolveAuth("platform")` and construct `createPlatformAuth` with explicit
# values pointing at THIS dedicated Hydra client instead. Zero changes to the
# shared `platform` or `ui` repos.
#
# Port 3004, not cbm-demo's own default 3002 — confirmed live that port 3002
# was already bound by a real, pre-existing `next-server` process (almost
# certainly the actual `platform` repo's own `apps/app`, which uses that same
# default port). Rather than kill a process this session didn't start,
# cbm-demo's own `apps/app/package.json` dev/start scripts were changed to
# port 3004 (confirmed free) — a local-only change, never pushed.
client_id: cbm-demo
client_name: NeoBIM CBM Demo (cognitive building model lab)
redirect_uris:
  - http://localhost:3004/auth/callback
post_logout_redirect_uris:
  - http://localhost:3004/auth/login
grant_types:
  - authorization_code
  - refresh_token
scope: openid profile email offline_access
client_secret_env_var: CBM_DEMO_OIDC_CLIENT_SECRET
token_endpoint_auth_method: client_secret_post
enabled: true
tenant_id: default
tags: [application-plugin, neobim, integrated]
