# =============================================================================
# Ory Keto — Production Configuration
# =============================================================================
# Relationship-Based Access Control (ReBAC) Engine configuration.
# Implements Google Zanzibar pattern for fine-grained permissions.
#
# Documentation: https://www.ory.sh/docs/keto/reference/configuration
# =============================================================================

version: v0.12.0

# ─── Service Identity ─────────────────────────────────────────────────────────
serve:
  read:
    port: 4466
    host: 0.0.0.0
    # Accessible to Oathkeeper Proxy and internal platform microservices
  write:
    port: 4467
    host: 0.0.0.0
    # Write endpoint MUST be isolated internally; never exposed to internet

# ─── Database ─────────────────────────────────────────────────────────────────
dsn: ${KETO_DATABASE_URL}

# ─── Namespaces (Authorization Model) ─────────────────────────────────────────
# Defines namespaces and relationships between objects.
namespaces:
  # Organization Tenant
  - id: 1
    name: Organization
  # Workspace or Project scoped under Org
  - id: 2
    name: Project
  # Team of users
  - id: 3
    name: Team
  # Generic Application Client
  - id: 4
    name: Application
  # User Subject
  - id: 5
    name: User
  # Protected Resource (e.g. Document, API endpoint)
  - id: 6
    name: Resource
  # Hierarchical group node (org > project > contractor > package), per
  # authz-architecture.html's "everything is a set of users granted a
  # relation on a node of one tree" model. Relations owners/managers/
  # editors/viewers (a "standing"), parent tuples encode the tree, and
  # read/write/manage/admin are PERMITS computed in application code
  # (platform/authorization-service's group_authz.py), not by Keto itself —
  # this v0.12 config declares bare namespace names/ids only (matches the
  # existing convention above); Keto's own OPL-compiled userset-rewrite
  # traversal was never wired for this deployment (see
  # ory/keto/namespaces/namespaces.ts's header comment), so the permit
  # hierarchy is enforced by reading real tuples and walking `parent`
  # manually. Additive: does not touch Organization/Project/Team/
  # Application/Resource/User above, which stay fully in service.
  - id: 7
    name: Group

# ─── Observability ────────────────────────────────────────────────────────────
log:
  level: info
  format: json

tracing:
  provider: otel
  providers:
    otlp:
      insecure: true
      sampling:
        sampling_ratio: 0.1
      # Keto v0.12's config loader does not perform ${VAR} substitution here
      # the way Kratos/Hydra's does — hardcoded, matching this file's own
      # convention of hardcoding other internal-network addresses (e.g. the
      # postgres-keto DSN above).
      # Keto's schema (unlike kratos/hydra/oathkeeper's) rejects a scheme here —
      # host:port only. 4318 = the collector's OTLP/HTTP receiver (Ory
      # exporters are HTTP; 4317 is gRPC and silently receives nothing —
      # both found live, AI_HANDOFF §1.13).
      server_url: otel-collector:4318
