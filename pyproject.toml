[project]
name = "enterprise-identity-platform-tooling"
version = "0.1.0"
description = "Validation tooling for the Enterprise Identity Platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "jsonschema==4.25.1",
  "PyYAML==6.0.2",
]

[dependency-groups]
dev = [
  "mypy==1.18.2",
  "pytest==8.4.2",
  "ruff==0.14.0",
  "types-jsonschema==4.25.1.20251009",
  "types-PyYAML==6.0.12.20250915",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["automation/validation", "tests/unit"]
python_version = "3.13"
strict = true
