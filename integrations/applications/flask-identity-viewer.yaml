# applications/examples/flask-identity-viewer — a custom, local-only relying party
# built to validate this platform's own identity flow (real ID/access/refresh
# tokens, real userinfo, real Keto tuples for the signed-in identity). Not a
# third-party product; never pushed anywhere.
client_id: flask-identity-viewer
client_name: Flask Identity Viewer (validation harness)
redirect_uris:
  - http://localhost:9931/callback
post_logout_redirect_uris:
  - http://localhost:9931/
grant_types:
  - authorization_code
  - refresh_token
scope: openid profile email offline_access
client_secret_env_var: FLASK_IDENTITY_VIEWER_OIDC_CLIENT_SECRET
token_endpoint_auth_method: client_secret_post
enabled: true
tenant_id: default
tags:
  - validation-harness
  - sample-app
