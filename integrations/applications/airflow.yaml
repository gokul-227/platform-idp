# applications/examples/airflow — real upstream application (apache/airflow:2.10.5),
# run from its unmodified official image, not vendored here.
#
# Confirmed live (re-verified via a real browser OAuth attempt): Airflow's
# AIRFLOW__WEBSERVER__BASE_URL is ${PLATFORM_BASE_URL}/apps/airflow, which
# resolves to http://localhost:4455/apps/airflow — Flask-AppBuilder derives
# its self-referencing OAuth redirect_uri FROM this base_url, so the actual
# callback Airflow sends is http://localhost:4455/apps/airflow/oauth-authorized/hydra
# (through Oathkeeper), NOT the direct-port (9929) URL a previous version of
# this file registered. That mismatch is exactly why Hydra rejected the real
# request with "redirect_uri does not match any of the OAuth 2.0 Client's
# pre-registered redirect urls" — confirmed via the literal `invalid_request`
# error and its embedded redirect_uri in Hydra's response.
client_id: airflow
client_name: Apache Airflow (real upstream Python/Flask application)
redirect_uris:
  - http://localhost:4455/apps/airflow/oauth-authorized/hydra
post_logout_redirect_uris:
  - http://localhost:4455/apps/airflow/
grant_types:
  - authorization_code
  - refresh_token
scope: openid profile email
# Same Flask-AppBuilder/Authlib stack as Superset — defaults to
# client_secret_basic, not this registry's usual client_secret_post
# convention. Always verify a new RP's actual behavior rather than assuming.
client_secret_env_var: AIRFLOW_OIDC_CLIENT_SECRET
token_endpoint_auth_method: client_secret_basic
enabled: true
tenant_id: default
tags: [application-plugin, python, airflow, verified-upstream]
