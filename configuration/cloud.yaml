# =============================================================================
# Enterprise Identity Platform — Cloud Provider Configuration
# =============================================================================
# This is the SINGLE FILE that controls which cloud provider the platform uses.
# Change `cloud` to switch providers: aws | gcp | azure | local
#
# All other configurations automatically derive from this value.
# See: docs/10-reference/cloud-abstraction.md
# =============================================================================

cloud: local

# ─── Cloud-Specific Settings ─────────────────────────────────────────────────
# These are loaded based on the value of `cloud` above. Not actually consumed
# by any deploy surface yet (see docs/10-reference/final-audit-report.md §6).

providers:
  aws:
    region: us-east-1
    secondary_region: us-west-2
    account_id: "${AWS_ACCOUNT_ID}"
    vpc_id: "${AWS_VPC_ID}"
    # Secret Manager
    secrets_arn_prefix: "arn:aws:secretsmanager:us-east-1:${AWS_ACCOUNT_ID}:secret:identity-platform"
    # Database
    rds_endpoint: "${AWS_RDS_ENDPOINT}"
    # Cache
    elasticache_endpoint: "${AWS_ELASTICACHE_ENDPOINT}"
    # Storage
    s3_bucket: "${AWS_S3_BUCKET}"
    s3_region: us-east-1
    # Container Registry
    ecr_registry: "${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com"

  gcp:
    project_id: "${GCP_PROJECT_ID}"
    region: us-central1
    secondary_region: us-east1
    # Secret Manager
    secret_prefix: "projects/${GCP_PROJECT_ID}/secrets/identity-platform"
    # Database (Cloud SQL)
    cloud_sql_connection_name: "${GCP_CLOUD_SQL_CONNECTION_NAME}"
    # Cache (Memorystore)
    memorystore_host: "${GCP_MEMORYSTORE_HOST}"
    # Storage
    gcs_bucket: "${GCP_GCS_BUCKET}"
    # Container Registry
    artifact_registry: "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/identity-platform"

  azure:
    subscription_id: "${AZURE_SUBSCRIPTION_ID}"
    resource_group: identity-platform
    region: eastus
    secondary_region: westus2
    # Key Vault
    key_vault_name: "${AZURE_KEY_VAULT_NAME}"
    # Database (Azure Database for PostgreSQL)
    postgres_server: "${AZURE_POSTGRES_SERVER}"
    # Cache (Azure Cache for Redis)
    redis_host: "${AZURE_REDIS_HOST}"
    # Storage
    storage_account: "${AZURE_STORAGE_ACCOUNT}"
    container_name: identity-platform

  local:
    # Docker Compose based local development
    postgres_host: localhost
    redis_host: localhost
    storage_path: ./data/storage
    secrets_path: ./.env
