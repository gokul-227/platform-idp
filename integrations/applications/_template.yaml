# =============================================================================
# Application Registry — Template
# =============================================================================
# Copy this file to a new *.yaml file in integrations/applications/ to register an app.
# Files prefixed with "_" are ignored during sync.
#
# After adding a definition:
#   ./automation/platform sync
#   — or —
#   curl -X POST http://localhost:8080/api/v1/sync
# =============================================================================

client_id: example-app
client_name: Example Application
redirect_uris:
  - http://localhost:4455/auth/callback
post_logout_redirect_uris:
  - http://localhost:4455/
grant_types:
  - authorization_code
  - refresh_token
scope: openid profile email offline_access
client_secret_env_var: EXAMPLE_APP_OIDC_CLIENT_SECRET
token_endpoint_auth_method: client_secret_post
enabled: false
tenant_id: default
tags:
  - template
  - example
