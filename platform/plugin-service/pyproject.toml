[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plugin_service"]

[project]
name = "plugin-service"
version = "1.0.0"
description = "Generic, admin-manageable plugin registry for the NeoBIM Identity Control Plane"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "prometheus-fastapi-instrumentator==7.0.0",
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "httpx==0.27.2",
  "pydantic==2.10.4",
  "PyYAML==6.0.2",
]

[dependency-groups]
dev = [
  "mypy==1.18.2",
  "pytest==8.4.2",
  "pytest-asyncio==0.24.0",
  "ruff==0.14.0",
  "types-PyYAML==6.0.12.20250915",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
  "ignore:'asyncio.get_event_loop_policy' is deprecated:DeprecationWarning",
  "ignore:'asyncio.set_event_loop_policy' is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
