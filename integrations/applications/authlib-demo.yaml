# applications/examples/authlib-demo — Python reference OIDC client (Authlib + FastAPI).
# enabled: false by default — flip to true and run `make sync` to create the
# Hydra client. Secret comes from the env var below, never from this file.
client_id: authlib-demo
client_name: authlib-demo (Python reference app)
redirect_uris:
  - http://localhost:3200/callback
post_logout_redirect_uris:
  - http://localhost:3200/
grant_types:
  - authorization_code
  - refresh_token
scope: openid profile email offline_access
client_secret_env_var: AUTHLIB_DEMO_SECRET
token_endpoint_auth_method: client_secret_post
enabled: false
tenant_id: default
tags:
  - sample-app
  - reference
