# applications/neobim/neobim-ui — NeoBIM's own design system (ui-neobim) + a page
# layout harvested from platform-neobim/apps/auth, wired to authenticate
# through THIS platform's existing Ory Hydra/Kratos rather than NeoBIM's own
# Better Auth / oauth-provider backend, which is intentionally NOT deployed.
# See docs/07-applications/neobim/neobim-ui.md for the full integration writeup and
# docs/07-applications/neobim-auth.md for why the auth backend was excluded.
client_id: neobim-ui
client_name: NeoBIM UI (design-system frontend, Ory-authenticated)
redirect_uris:
  - http://localhost:9930/auth/callback
post_logout_redirect_uris:
  - http://localhost:9930/
grant_types:
  - authorization_code
  - refresh_token
scope: openid profile email
# openid-client v6's default client_secret_jwt/basic auth method for a
# confidential client registered without an explicit
# token_endpoint_auth_method is client_secret_basic — matching every other
# real app in this registry's actual (non-default-convention) behavior.
client_secret_env_var: NEOBIM_OIDC_CLIENT_SECRET
token_endpoint_auth_method: client_secret_basic
enabled: true
tenant_id: default
tags: [application-plugin, typescript, neobim, additive]
