[project]
name = "authlib-demo"
version = "1.0.0"
description = "Reference OIDC client (Python + Authlib) against the Enterprise Identity Platform. Pluggable, replaceable — see README.md."
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "authlib>=1.3.2",
    "httpx>=0.27",
    "itsdangerous>=2.2",
]

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/authlib_demo"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
